name: Deploy to Cloudflare

# Builds the app for Cloudflare Workers and deploys it. Needs two repository
# secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # Fail fast with a readable message instead of a cryptic wrangler error,
      # and prove the token actually works before spending time on the build.
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          npx --yes wrangler@4 whoami

      # Pinned to the version that generated pnpm-lock.yaml, so
      # `--frozen-lockfile` is guaranteed to pass.
      - name: Install pnpm
        run: npm install -g pnpm@12.5.1

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Vercel stays the default target; this build is for Cloudflare.
      - name: Build
        run: pnpm build
        env:
          NITRO_PRESET: cloudflare_module

      # Deliberately not cloudflare/wrangler-action: it installs wrangler with
      # this project's package manager, and pnpm refuses the install scripts of
      # its esbuild/workerd dependencies (ERR_PNPM_IGNORED_BUILDS). npm does not
      # block them, so npx gets us a working wrangler without loosening pnpm's
      # supply-chain policy.
      - name: Deploy
        run: npx --yes wrangler@4 deploy --config .output/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
