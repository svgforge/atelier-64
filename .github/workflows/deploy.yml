name: Deploy to Cloudflare

# Builds the app for Cloudflare Workers and deploys it. Needs two repository
# secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # Pinned to the version that generated pnpm-lock.yaml, so
      # `--frozen-lockfile` is guaranteed to pass.
      - name: Install pnpm
        run: npm install -g pnpm@12.5.1

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Vercel stays the default target; this build is for Cloudflare.
      - name: Build
        run: pnpm build
        env:
          NITRO_PRESET: cloudflare_module

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          # Nitro writes the config next to the server bundle.
          command: deploy --config .output/server/wrangler.json
